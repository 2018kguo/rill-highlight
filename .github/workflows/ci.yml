name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A fixed Rust, so a new stable's new lints cannot fail a release; bump it on purpose.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features wasm-exports -- -D warnings
      - run: cargo test
      - run: cargo publish --dry-run

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # Grammars, wasm and the package's notices; then every bundled pattern
      # must compile in the Rust engine.
      - run: npm run build
      - run: cargo test --test grammars
        working-directory: .
      # Tokenizing work grows linearly with the input (operation counts at n, 2n,
      # 4n on long lines, many lines, deep nesting; see tests/doubling.rs).
      - run: cargo test --release --features op-counts --test doubling
        working-directory: .
      # API behavior, tokens and HTML vs Shiki 4.5.0 on the checked-in edge
      # corpus, streaming prefixes for three languages, and the packed tarball.
      - run: npm run test:ci
      # The packed tarball bundled by Vite and bun, run in Chromium (main thread
      # and a worker).
      - uses: oven-sh/setup-bun@v2
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:bundle
